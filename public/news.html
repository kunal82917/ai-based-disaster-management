<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - DisasterWatch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="community.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <path d="M30 5L50 20L45 45L30 55L15 45L10 20L30 5Z" stroke="currentColor" stroke-width="3" fill="none"/>
                        <circle cx="30" cy="30" r="8" fill="currentColor"/>
                        <path d="M30 22V15M30 45V38M38 30H45M15 30H22" stroke="currentColor" stroke-width="2.5"/>
                    </svg>
                    <span>DisasterWatch</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" id="reportCaseBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4m0 4h.01"/>
                    </svg>
                    <span>Report Case</span>
                </a>
                <a href="#" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 3H5a2 2 0 0 0-2 2v4m0 0a2 2 0 0 0 2 2h4m0 0h4a2 2 0 0 0 2-2v-4m0 0a2 2 0 0 0-2-2h-4m0 0v4m0 0h4"/>
                    </svg>
                    <span>AI Assistant</span>
                </a>
                <a href="#" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2-2 2 2 0 0 0-2 2m0 0a2 2 0 0 1 2-2 2 2 0 0 1 2 2m-3 7h3m-3 4h3"/>
                    </svg>
                    <span>My Reports</span>
                </a>
                <a href="#" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Community</span>
                </a>
                <a href="#" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11H7a4 4 0 0 0-4 4v7a1 1 0 0 0 1 1h3m0-10l2-5h4l2 5m0 0v7a1 1 0 0 1-1 1h-3"/>
                    </svg>
                    <span>Emergency Resources</span>
                </a>
                <a href="#" class="nav-item active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span>News</span>
                </a>

                <!-- Divider -->
                <div style="height: 1px; background: rgba(255, 255, 255, 0.1); margin: var(--space-md) 0;"></div>

                <a href="#" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile" id="profileBtn">
                    <div class="user-avatar">
                        <img id="sidebarAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23667eea'/%3E%3Ctext x='50' y='50' text-anchor='middle' dy='.3em' fill='white' font-size='40' font-family='Arial'%3EJD%3C/text%3E%3C/svg%3E" alt="User">
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="sidebarUserName">Kunal Gupta</div>
                        <div class="user-role" id="sidebarUserRole">Administrator</div>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="dashboard-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="header-left">
                    <h1>Latest News</h1>
                    <p class="header-subtitle">Stay informed with the latest disaster-related updates</p>
                </div>
                <div class="header-right">
                    <div class="status-badge status-active">
                        <span class="status-dot"></span>
                        Live Updates
                    </div>
                    <div class="last-updated">
                        Updated: <span id="lastUpdated">Just now</span>
                    </div>
                </div>
            </header>

            <!-- News Content -->
            <div class="news-content">
                <div class="news-filters">
                    <button class="filter-btn active" data-filter="all">All News</button>
                    <button class="filter-btn" data-filter="breaking">Breaking</button>
                    <button class="filter-btn" data-filter="alert">Alerts</button>
                    <button class="filter-btn" data-filter="update">Updates</button>
                </div>

                <div class="news-articles" id="newsArticles">
                    <!-- News articles will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="news.js"></script>
    <script>
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        // Load user profile
        const userName = sessionStorage.getItem('username') || 'Guest User';
        const userRole = sessionStorage.getItem('userRole') || 'User';
        
        document.getElementById('sidebarUserName').textContent = userName;
        document.getElementById('sidebarUserRole').textContent = userRole;

        // Check if user is logged in
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
